<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — AHCA Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{
      --bg:#050D07;--green:#02B36A;--green-l:#5ECFA0;--green-d:#018F54;
      --gold:#C9A84C;--gold-l:#E5C97A;--gold-d:#A0732A;
      --red:#ef4444;--text:#E8F5EC;--text-2:#9DB8A4;--text-3:#5C7A63;
      --border:rgba(94,207,160,.12);--surface:rgba(8,22,12,.8);
      --r:14px;--r-sm:10px;--r-f:100px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100svh;display:flex}

    /* ── SIDEBAR ── */
    .sidebar{width:220px;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;background:rgba(4,11,6,.97);border-right:1px solid rgba(201,168,76,.12);display:flex;flex-direction:column;padding:20px 12px;z-index:200}
    .logo{display:flex;align-items:center;gap:9px;padding:4px 8px;margin-bottom:28px}
    .logo-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--bg)}
    .logo-name{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}
    .logo-name span{color:var(--gold-l)}
    .admin-badge{margin:0 8px 18px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.18);border-radius:7px;padding:7px 11px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--gold-l);font-weight:600}
    .nav-a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-sm);margin-bottom:2px;color:var(--text-2);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .15s}
    .nav-a i{font-size:16px}
    .nav-a:hover{background:rgba(201,168,76,.06);color:var(--text)}
    .nav-a.active{background:rgba(201,168,76,.1);color:var(--gold-l);font-weight:600}
    .nav-sep{height:1px;background:var(--border);margin:12px 8px}

    /* ── MAIN ── */
    .main{flex:1;margin-left:220px;min-height:100svh;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(5,13,7,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .tb-h1{font-family:'Syne',sans-serif;font-size:19px;font-weight:700}
    .tb-sub{font-size:12px;color:var(--text-3);margin-top:2px}
    .content{padding:24px 28px;flex:1}

    /* ── TABS ── */
    .tabs{display:flex;gap:3px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px;margin-bottom:24px;width:fit-content}
    .tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text-3);transition:all .2s;display:flex;align-items:center;gap:6px}
    .tab.active{background:rgba(201,168,76,.12);color:var(--gold-l);border:1px solid rgba(201,168,76,.2)}
    .tab-panel{display:none}
    .tab-panel.active{display:block}

    /* ── CARD ── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:18px}
    .card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:7px;color:var(--text)}
    .card-title i{color:var(--gold-l)}

    /* ── TABLE ── */
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:9px 13px;border-bottom:1px solid var(--border)}
    td{padding:13px;border-bottom:1px solid rgba(94,207,160,.04);font-size:13px;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green-d),var(--green));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:var(--bg);flex-shrink:0}
    .ci{display:flex;align-items:center;gap:9px}
    .cn{font-weight:600;font-size:13px}
    .cc{font-size:11px;color:var(--text-3);margin-top:1px}
    .chips{display:flex;flex-wrap:wrap;gap:4px}
    .chip{background:rgba(2,179,106,.07);border:1px solid rgba(2,179,106,.14);border-radius:4px;font-size:10px;font-weight:600;color:var(--green-l);padding:2px 7px;white-space:nowrap}
    .chip-sub{background:rgba(201,168,76,.06);border-color:rgba(201,168,76,.15);color:var(--gold)}
    .chip-done{background:rgba(94,207,160,.04);border-color:var(--border);color:var(--text-3)}
    .abts{display:flex;gap:5px;flex-wrap:wrap}
    .abt{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid;cursor:pointer;background:none;transition:background .15s;white-space:nowrap}
    .abt-gold{color:var(--gold-l);border-color:rgba(201,168,76,.25)}
    .abt-gold:hover{background:rgba(201,168,76,.1)}
    .abt-green{color:var(--green-l);border-color:rgba(2,179,106,.25)}
    .abt-green:hover{background:rgba(2,179,106,.1)}

    /* ── FORMS ── */
    .fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
    .f{display:flex;flex-direction:column;gap:5px}
    .f.full{grid-column:1/-1}
    .f label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em}
    input,select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;width:100%}
    input:focus,select:focus,textarea:focus{border-color:rgba(201,168,76,.5)}
    input[type=date]{color-scheme:dark}
    select option{background:#0a1a0c}
    textarea{resize:vertical;min-height:72px}
    .input-hint{font-size:10px;color:var(--text-3);margin-top:2px}

    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--r-f);font-size:13px;font-weight:700;font-family:'Syne',sans-serif;border:none;cursor:pointer;transition:opacity .2s,transform .15s}
    .btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-gold{background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--bg);box-shadow:0 5px 18px rgba(201,168,76,.22)}
    .btn-green{background:linear-gradient(135deg,var(--green-d),var(--green));color:var(--bg);box-shadow:0 5px 18px rgba(2,179,106,.22)}
    .btn-ghost{background:none;border:1px solid var(--border);color:var(--text-2)}
    .btn-danger{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5}

    /* ── SLIDE PANEL ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:400;opacity:0;pointer-events:none;transition:opacity .3s}
    .overlay.open{opacity:1;pointer-events:all}
    .panel{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100vw;background:#060f08;border-left:1px solid rgba(201,168,76,.15);z-index:500;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.68,0,1.2);display:flex;flex-direction:column}
    .panel.open{transform:translateX(0)}
    .ph{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
    .ph-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
    .ph-sub{font-size:11px;color:var(--text-3);margin-top:3px}
    .ph-close{background:none;border:none;color:var(--text-3);font-size:19px;cursor:pointer;padding:3px;flex-shrink:0}
    .ph-close:hover{color:var(--text)}
    .pb{flex:1;overflow-y:auto;padding:20px 22px;scrollbar-width:thin;scrollbar-color:rgba(201,168,76,.15) transparent}

    /* ── PANEL INNER TABS ── */
    .ptabs{display:flex;gap:3px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:18px}
    .ptab{flex:1;padding:7px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--text-3);transition:all .2s;text-align:center;letter-spacing:.03em;text-transform:uppercase}
    .ptab.active{background:rgba(201,168,76,.12);color:var(--gold-l);border:1px solid rgba(201,168,76,.18)}
    .ptab-panel{display:none}
    .ptab-panel.active{display:block}

    /* ── SERVICE ITEMS ── */
    .svc-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden}
    .svc-item-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none}
    .svc-item-head:hover{background:rgba(255,255,255,.03)}
    .svc-item-info{flex:1;min-width:0}
    .svc-main{font-size:13px;font-weight:700}
    .svc-sub{font-size:11px;color:var(--text-3);margin-top:2px}
    .svc-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:4px}
    .st-active{color:var(--green-l);background:rgba(2,179,106,.1);border:1px solid rgba(2,179,106,.18)}
    .st-pending{color:var(--gold);background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.18)}
    .st-completed{color:var(--text-3);background:rgba(94,207,160,.04);border:1px solid var(--border)}
    .svc-item-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
    .svc-item-body.open{display:block}
    .svc-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;margin-top:14px}
    .sm{background:rgba(255,255,255,.03);border-radius:8px;padding:10px;text-align:center}
    .sm-lbl{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
    .sm-val{font-size:13px;font-weight:700}

    /* ── PAYMENT LIST ── */
    .pay-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .pay-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
    .pay-ico{width:30px;height:30px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
    .pi-advance{background:rgba(201,168,76,.1);color:var(--gold)}
    .pi-second{background:rgba(2,179,106,.1);color:var(--green-l)}
    .pi-final{background:rgba(94,207,160,.1);color:var(--green-l)}
    .pi-other{background:rgba(59,130,246,.1);color:#93c5fd}
    .pay-info{flex:1}
    .pay-type{font-size:11px;font-weight:700;text-transform:capitalize;color:var(--text)}
    .pay-date{font-size:10px;color:var(--text-3);margin-top:1px}
    .pay-note{font-size:10px;color:var(--text-2);font-style:italic;margin-top:1px}
    .pay-amt{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--green-l);flex-shrink:0}
    .pay-del{background:none;border:none;color:var(--text-3);cursor:pointer;padding:3px;font-size:13px}
    .pay-del:hover{color:#fca5a5}

    /* ── FEE BAR ── */
    .fee-bar{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:14px}
    .fee-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .fee-bar-lbl{font-size:11px;color:var(--text-2)}
    .fee-bar-val{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
    .fee-track{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
    .fee-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green-d),var(--green-l));transition:width .5s ease}
    .fee-nums{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--text-3)}

    /* ── MISC ── */
    .divider{border:none;border-top:1px solid var(--border);margin:16px 0}
    .sec-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
    .empty{text-align:center;padding:22px;background:rgba(255,255,255,.02);border:1px dashed var(--border);border-radius:var(--r-sm)}
    .empty i{font-size:22px;color:var(--text-3);display:block;margin-bottom:6px}
    .empty p{font-size:12px;color:var(--text-3)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{text-align:center;padding:28px;color:var(--text-3);font-size:13px}
    .loading i{font-size:26px;animation:spin .8s linear infinite;display:block;margin-bottom:8px}
    .spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(5,13,7,.3);border-top-color:var(--bg);animation:spin .6s linear infinite}
    .toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:13px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;transform:translateY(80px);transition:transform .3s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.4)}
    .toast.show{transform:translateY(0)}
    .toast-ok{background:rgba(2,179,106,.14);border:1px solid rgba(2,179,106,.28);color:var(--green-l)}
    .toast-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#fca5a5}
    @media(max-width:900px){.sidebar{display:none}.main{margin-left:0}.fg{grid-template-columns:1fr}.fg3,.fg4{grid-template-columns:1fr 1fr}.panel{width:100vw}.svc-meta-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><div class="logo-mark">A</div><div class="logo-name">AHCA <span>Admin</span></div></div>
  <div class="admin-badge"><i class="ti ti-shield-check"></i> Admin Access</div>
  <a class="nav-a active" onclick="showTab('clients')"><i class="ti ti-users"></i> All Clients</a>
  <a class="nav-a" onclick="showTab('addClient')"><i class="ti ti-user-plus"></i> Add Client</a>
  <a class="nav-a" onclick="showTab('uploadDoc')"><i class="ti ti-upload"></i> Upload Document</a>
  <div class="nav-sep"></div>
  <a class="nav-a" href="../index.html" target="_blank"><i class="ti ti-world"></i> Website</a>
  <a class="nav-a" href="dashboard.html"><i class="ti ti-layout-dashboard"></i> Client View</a>
  <div style="margin-top:auto">
    <button class="nav-a" id="logoutBtn" style="color:#fca5a5"><i class="ti ti-logout"></i> Sign out</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div><div class="tb-h1">Admin Panel</div><div class="tb-sub" id="adminEmail">—</div></div>
    <button class="btn btn-gold" onclick="showTab('addClient')"><i class="ti ti-user-plus"></i> New Client</button>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab active" onclick="showTab('clients')" id="tab-clients"><i class="ti ti-users"></i> Clients</button>
      <button class="tab" onclick="showTab('addClient')" id="tab-addClient"><i class="ti ti-user-plus"></i> Add Client</button>
      <button class="tab" onclick="showTab('uploadDoc')" id="tab-uploadDoc"><i class="ti ti-upload"></i> Documents</button>
    </div>

    <!-- ── CLIENTS ── -->
    <div class="tab-panel active" id="panel-clients">
      <div class="card">
        <div class="card-title"><i class="ti ti-users"></i> All Clients <span id="clientCount" style="font-size:12px;font-weight:400;color:var(--text-3)"></span></div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Client</th><th>Services</th><th>Actions</th></tr></thead>
            <tbody id="clientsTbody"><tr><td colspan="3"><div class="loading"><i class="ti ti-loader"></i>Loading…</div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── ADD CLIENT ── -->
    <div class="tab-panel" id="panel-addClient">
      <div class="card">
        <div class="card-title"><i class="ti ti-user-plus"></i> Create Client Account</div>
        <div class="fg" style="margin-bottom:14px">
          <div class="f"><label>Full Name *</label><input type="text" id="ac_name" placeholder="Ahmed Al Mansouri"></div>
          <div class="f"><label>Company Name</label><input type="text" id="ac_company" placeholder="Al Mansouri Trading LLC"></div>
          <div class="f"><label>Email Address *</label><input type="email" id="ac_email" placeholder="ahmed@company.ae"></div>
          <div class="f"><label>Phone / WhatsApp</label><input type="text" id="ac_phone" placeholder="+971 50 000 0000"></div>
          <div class="f"><label>Password *</label><input type="password" id="ac_pass" placeholder="Min 8 characters"></div>
          <div class="f"><label>Notes (internal)</label><input type="text" id="ac_notes" placeholder="Any internal notes…"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:rgba(2,179,106,.04);border:1px solid rgba(2,179,106,.1);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:18px">
          <i class="ti ti-info-circle" style="color:var(--green-l);font-size:15px;flex-shrink:0"></i>
          <span style="font-size:12px;color:var(--text-2)">After creating the client, go to <strong>Clients</strong> → click <strong>Services</strong> to assign services with dates and fees.</span>
        </div>
        <button class="btn btn-gold" id="addClientBtn" onclick="addClient()"><i class="ti ti-user-plus"></i> Create Client Account</button>
      </div>
    </div>

    <!-- ── UPLOAD DOC ── -->
    <div class="tab-panel" id="panel-uploadDoc">
      <div class="card">
        <div class="card-title"><i class="ti ti-upload"></i> Upload Document</div>
        <div class="fg" style="margin-bottom:14px">
          <div class="f full"><label>Client *</label><select id="ud_client"><option value="">— Select client —</option></select></div>
          <div class="f"><label>File Name *</label><input type="text" id="ud_name" placeholder="VAT Return Q1 2025.pdf"></div>
          <div class="f"><label>File URL *</label><input type="text" id="ud_url" placeholder="https://drive.google.com/…"></div>
          <div class="f full"><label>Notes for client</label><textarea id="ud_notes" placeholder="Describe this document…"></textarea></div>
        </div>
        <button class="btn btn-gold" onclick="uploadDoc()"><i class="ti ti-cloud-upload"></i> Upload Document</button>
      </div>
    </div>
  </div>
</div>

<!-- ── SERVICE MANAGEMENT PANEL ── -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="svcPanel">
  <div class="ph">
    <div>
      <div class="ph-title" id="phTitle">Services</div>
      <div class="ph-sub" id="phSub"></div>
    </div>
    <button class="ph-close" onclick="closePanel()"><i class="ti ti-x"></i></button>
  </div>
  <div class="pb" id="panelBody"><div class="loading"><i class="ti ti-loader"></i>Loading…</div></div>
</div>

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ window.location.href='login.html'; return; }
  if(session.user.email!==ADMIN){
    document.body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;font-family:'Inter',sans-serif;gap:10px">

async function loadClients(){
  const {data}=await sb.from('clients').select('*').order('full_name');
  clients=data||[];
  document.getElementById('clientCount').textContent=`(${clients.length})`;
  renderTable();
  populateDropdown();
}

async function renderTable(){
  const tb=document.getElementById('clientsTbody');
  if(!clients.length){ tb.innerHTML=`<tr><td colspan="3"><div class="empty"><i class="ti ti-users"></i><p>No clients yet</p></div></td></tr>`; return; }
  tb.innerHTML='';
  for(const c of clients){
    const {data:svcs}=await sb.from('client_services').select('service_name,custom_name,status,sub_category').eq('client_id',c.id);
    const tr=document.createElement('tr');
    const chips=(svcs||[]).map(s=>{
      const label=(s.custom_name||s.service_name||'').slice(0,20);
      const cls=s.status==='completed'?'chip-done':s.sub_category?'chip-sub':'';
      return `<span class="chip ${cls}">${label}</span>`;
    }).join('');
    const nm=(c.full_name||'').replace(/'/g,'&#39;');
    tr.innerHTML=`
      <td><div class="ci"><div class="av">${initials(c.full_name)}</div>
        <div><div class="cn">${c.full_name}</div><div class="cc">${c.company||c.email}</div></div></div></td>
      <td><div class="chips">${chips||'<span style="font-size:11px;color:var(--text-3)">None</span>'}</div></td>
      <td><div class="abts">
        <button class="abt abt-gold" onclick="openPanel('${c.id}','${nm}')"><i class="ti ti-briefcase"></i> Services</button>
        <button class="abt abt-green" onclick="quickDoc('${c.id}')"><i class="ti ti-upload"></i> Upload</button>
      </div></td>`;
    tb.appendChild(tr);
  }
}

function populateDropdown(){
  const s=document.getElementById('ud_client');
  s.innerHTML='<option value="">— Select client —</option>';
  clients.forEach(c=>{ s.innerHTML+=`<option value="${c.id}">${c.full_name}${c.company?' ('+c.company+')':''}</option>`; });
}

// ── ADD CLIENT ──
async function addClient(){
  const name=document.getElementById('ac_name').value.trim();
  const email=document.getElementById('ac_email').value.trim();
  const pass=document.getElementById('ac_pass').value;
  const company=document.getElementById('ac_company').value.trim();
  const phone=document.getElementById('ac_phone').value.trim();
  if(!name||!email||!pass){ toast('Name, email & password required','err'); return; }
  if(pass.length<8){ toast('Password min 8 characters','err'); return; }
  const btn=document.getElementById('addClientBtn');
  btn.disabled=true; btn.innerHTML='<div class="spin"></div> Creating…';
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(error){ toast(error.message,'err'); btn.disabled=false; btn.innerHTML='<i class="ti ti-user-plus"></i> Create Client Account'; return; }
  await sb.from('clients').upsert({id:data.user.id,full_name:name,email,company:company||null,phone:phone||null});
  toast(`"${name}" created! Now assign services from the Clients tab.`);
  ['ac_name','ac_email','ac_pass','ac_company','ac_phone','ac_notes'].forEach(id=>document.getElementById(id).value='');
  btn.disabled=false; btn.innerHTML='<i class="ti ti-user-plus"></i> Create Client Account';

  showTab('clients');
}

async function loadPayArea(svcId, clientId){
  const el=document.getElementById('payarea-'+svcId);
  if(!el) return;
  const {data:pays}=await sb.from('payments').select('*').eq('service_id',svcId).order('payment_date');
  const {data:s}=await sb.from('client_services').select('fees').eq('id',svcId).single();
  const fees=Number(s?.fees||0);
  const paid=(pays||[]).reduce((a,p)=>a+Number(p.amount),0);
  const bal=fees-paid;
  const pct=fees>0?Math.min(100,Math.round(paid/fees*100)):0;

  el.innerHTML=`
    ${fees>0?`<div class="fee-bar">
      <div class="fee-bar-top"><span class="fee-bar-lbl">Payment Progress</span><span class="fee-bar-val">${pct}%</span></div>
      <div class="fee-track"><div class="fee-fill" style="width:${pct}%"></div></div>
      <div class="fee-nums"><span>Paid: ${fmtAED(paid)}</span><span>Balance: <span style="color:${bal<=0?'var(--green-l)':'var(--gold)'}">${fmtAED(Math.max(0,bal))}</span></span></div>
    </div>`:''}
    <div class="pay-list">
      ${(pays||[]).map(p=>payRowHtml(p)).join('')}
      ${!(pays||[]).length?`<div class="empty" style="padding:14px"><i class="ti ti-receipt-off"></i><p>No payments yet</p></div>`:''}
    </div>
    <div class="sec-label" style="font-size:12px;margin-bottom:10px">Record Payment</div>
    <div class="fg4" style="margin-bottom:10px">
      <div class="f">
        <label>Type</label>
        <select id="np_type_${svcId}">
          <option value="advance">Advance</option>
          <option value="second">2nd Payment</option>
          <option value="final">Final</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="f"><label>Amount (AED)</label><input type="number" id="np_amt_${svcId}" placeholder="0" min="0"></div>
      <div class="f"><label>Date</label><input type="date" id="np_date_${svcId}" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="f"><label>Notes</label><input type="text" id="np_note_${svcId}" placeholder="Optional"></div>
    </div>
    <button class="btn btn-green" style="font-size:12px;padding:8px 14px" onclick="addPayment('${svcId}','${clientId}')"><i class="ti ti-plus"></i> Record Payment</button>
  `;
}

function payRowHtml(p){
  const ico={advance:'pi-advance ti-coins',second:'pi-second ti-cash',final:'pi-final ti-circle-check',other:'pi-other ti-credit-card'}[p.payment_type]||'pi-other ti-credit-card';
  const [cls,icon]=ico.split(' ');
  return `<div class="pay-row">
    <div class="pay-ico ${cls}"><i class="ti ${icon}"></i></div>
    <div class="pay-info">
      <div class="pay-type">${p.payment_type} payment</div>
      <div class="pay-date">${fmtDate(p.payment_date)}</div>
      ${p.notes?`<div class="pay-note">${p.notes}</div>`:''}
    </div>
    <div class="pay-amt">${fmtAED(p.amount)}</div>
    <button class="pay-del" onclick="delPay('${p.id}','${p.service_id}','${p.client_id}')"><i class="ti ti-trash"></i></button>
  </div>`;
}

// ── PAYMENTS ──
async function addPayment(svcId, clientId){
  const type=document.getElementById('np_type_'+svcId).value;
  const amount=parseFloat(document.getElementById('np_amt_'+svcId).value);
  const date=document.getElementById('np_date_'+svcId).value;
  const notes=document.getElementById('np_note_'+svcId)?.value.trim()||null;
  if(!amount||amount<=0){ toast('Enter a valid amount','err'); return; }
  const {error}=await sb.from('payments').insert({service_id:svcId,client_id:clientId,payment_type:type,amount,payment_date:date,notes});
  if(error){ toast(error.message,'err'); return; }
  toast('Payment recorded!');

  // Auto-close prompt
  const {data:pays}=await sb.from('payments').select('amount').eq('service_id',svcId);
  const {data:s}=await sb.from('client_services').select('fees,status').eq('id',svcId).single();
  const totalPaid=(pays||[]).reduce((a,p)=>a+Number(p.amount),0);
  if(Number(s?.fees||0)>0 && totalPaid>=Number(s.fees) && s.status!=='completed'){
    if(confirm(`Fully paid (${fmtAED(totalPaid)}). Mark this service as Closed?`)){
      await sb.from('client_services').update({status:'completed'}).eq('id',svcId);
      toast('Marked as Closed ✓');
    }
  }
  await renderSvcList();
  // Re-open the accordion
  setTimeout(()=>{ const b=document.getElementById('sib-'+svcId); if(b){b.classList.add('open'); document.getElementById('chev-'+svcId).style.transform='rotate(180deg)';} },100);
}

async function delPay(payId, svcId){
  if(!confirm('Delete this payment?')) return;
  await sb.from('payments').delete().eq('id',payId);
  toast('Deleted');
  await renderSvcList();
  setTimeout(()=>{ const b=document.getElementById('sib-'+svcId); if(b){b.classList.add('open'); document.getElementById('chev-'+svcId).style.transform='rotate(180deg)';} },100);
}
