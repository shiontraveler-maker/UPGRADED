<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — AHCA Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{
      --bg:#050D07;--green:#02B36A;--green-l:#5ECFA0;--green-d:#018F54;
      --gold:#C9A84C;--gold-l:#E5C97A;--gold-d:#A0732A;
      --red:#ef4444;--text:#E8F5EC;--text-2:#9DB8A4;--text-3:#5C7A63;
      --border:rgba(94,207,160,.12);--surface:rgba(8,22,12,.8);
      --r:14px;--r-sm:10px;--r-f:100px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100svh;display:flex}
    .sidebar{width:240px;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;background:rgba(4,11,6,.97);border-right:1px solid rgba(201,168,76,.15);display:flex;flex-direction:column;padding:24px 14px;z-index:200}
    .logo{display:flex;align-items:center;gap:10px;padding:4px 10px;margin-bottom:36px}
    .logo-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--bg)}
    .logo-name{font-family:'Syne',sans-serif;font-weight:700;font-size:17px}
    .logo-name span{color:var(--gold-l)}
    .admin-badge{margin:0 10px 20px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold-l);font-weight:600}
    .nav-a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:2px;color:var(--text-2);font-size:13px;font-weight:500;text-decoration:none;transition:background .15s,color .15s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
    .nav-a i{font-size:17px}
    .nav-a:hover{background:rgba(201,168,76,.06);color:var(--text)}
    .nav-a.active{background:rgba(201,168,76,.1);color:var(--gold-l);font-weight:600}
    .main{flex:1;margin-left:240px;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border);background:rgba(5,13,7,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .tb-h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:700}
    .tb-sub{font-size:13px;color:var(--text-2);margin-top:2px}
    .content{padding:28px 32px}
    .tabs{display:flex;gap:4px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px;margin-bottom:28px;width:fit-content}
    .tab{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text-3);transition:all .2s;display:flex;align-items:center;gap:7px}
    .tab.active{background:rgba(201,168,76,.12);color:var(--gold-l);border:1px solid rgba(201,168,76,.2)}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:20px}
    .card-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .card-title i{color:var(--gold-l)}
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;border-bottom:1px solid var(--border)}
    td{padding:14px;border-bottom:1px solid rgba(94,207,160,.05);font-size:13px;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .client-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green-d),var(--green));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:var(--bg);flex-shrink:0}
    .client-info{display:flex;align-items:center;gap:10px}
    .client-name{font-weight:600}
    .client-co{font-size:11px;color:var(--text-3);margin-top:1px}
    .svc-chips{display:flex;flex-wrap:wrap;gap:4px}
    .chip{background:rgba(2,179,106,.08);border:1px solid rgba(2,179,106,.15);border-radius:4px;font-size:10px;font-weight:600;color:var(--green-l);padding:2px 7px;white-space:nowrap}
    .chip-closed{background:rgba(94,207,160,.04);border-color:var(--border);color:var(--text-3)}
    .chip-pending{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.2);color:var(--gold)}
    .action-btns{display:flex;gap:6px;flex-wrap:wrap}
    .act-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid;cursor:pointer;background:none;transition:background .15s;white-space:nowrap}
    .act-btn-green{color:var(--green-l);border-color:rgba(2,179,106,.25)}
    .act-btn-green:hover{background:rgba(2,179,106,.1)}
    .act-btn-gold{color:var(--gold-l);border-color:rgba(201,168,76,.25)}
    .act-btn-gold:hover{background:rgba(201,168,76,.1)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field.full{grid-column:1/-1}
    label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
    input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;width:100%}
    input:focus,select:focus,textarea:focus{border-color:rgba(201,168,76,.5)}
    select option{background:#0a1a0c;color:var(--text)}
    textarea{resize:vertical;min-height:80px}
    .services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:4px}
    .svc-check{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;cursor:pointer;transition:border-color .2s}
    .svc-check:hover{border-color:rgba(201,168,76,.3)}
    .svc-check input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
    .svc-check-lbl{font-size:13px;font-weight:500}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:var(--r-f);font-size:14px;font-weight:700;font-family:'Syne',sans-serif;border:none;cursor:pointer;transition:opacity .2s,transform .2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .btn-gold{background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--bg);box-shadow:0 6px 20px rgba(201,168,76,.25)}
    .btn-green{background:linear-gradient(135deg,var(--green-d),var(--green));color:var(--bg);box-shadow:0 6px 20px rgba(2,179,106,.25)}
    .toast{position:fixed;top:20px;right:24px;z-index:9999;padding:14px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;transform:translateY(-80px);transition:transform .3s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.4)}
    .toast.show{transform:translateY(0)}
    .toast-success{background:rgba(2,179,106,.15);border:1px solid rgba(2,179,106,.3);color:var(--green-l)}
    .toast-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:400;opacity:0;pointer-events:none;transition:opacity .3s}
    .panel-overlay.open{opacity:1;pointer-events:all}
    .panel{position:fixed;top:0;right:0;bottom:0;width:580px;max-width:100vw;background:rgba(5,14,8,.98);border-left:1px solid rgba(201,168,76,.15);z-index:500;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.68,0,1.2);display:flex;flex-direction:column;overflow:hidden}
    .panel.open{transform:translateX(0)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
    .panel-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700}
    .panel-close{background:none;border:none;color:var(--text-3);font-size:20px;cursor:pointer;padding:4px}
    .panel-close:hover{color:var(--text)}
    .panel-body{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:rgba(201,168,76,.2) transparent}
    .ptabs{display:flex;gap:3px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:20px}
    .ptab{flex:1;padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text-3);transition:all .2s;text-align:center}
    .ptab.active{background:rgba(201,168,76,.12);color:var(--gold-l);border:1px solid rgba(201,168,76,.18)}
    .ptab-panel{display:none}
    .ptab-panel.active{display:block}
    .pay-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
    .pay-ico{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
    .pay-ico--advance{background:rgba(201,168,76,.1);color:var(--gold)}
    .pay-ico--second{background:rgba(2,179,106,.1);color:var(--green-l)}
    .pay-ico--final{background:rgba(94,207,160,.1);color:var(--green-l)}
    .pay-ico--other{background:rgba(59,130,246,.1);color:#93c5fd}
    .pay-info{flex:1}
    .pay-type{font-size:12px;font-weight:600;color:var(--text);text-transform:capitalize}
    .pay-date{font-size:11px;color:var(--text-3)}
    .pay-note{font-size:11px;color:var(--text-2);font-style:italic}
    .pay-amount{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--green-l);flex-shrink:0}
    .pay-del{background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;font-size:14px;flex-shrink:0}
    .pay-del:hover{color:#fca5a5}
    .fee-summary{display:flex;gap:12px;margin-bottom:20px}
    .fee-box{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;text-align:center}
    .fee-box-lbl{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
    .fee-box-val{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
    .section-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(5,13,7,.3);border-top-color:var(--bg);animation:spin .6s linear infinite}
    .loading{text-align:center;padding:30px;color:var(--text-3);font-size:13px}
    .loading i{font-size:28px;animation:spin .8s linear infinite;display:block;margin-bottom:8px}
    .empty{text-align:center;padding:24px;background:rgba(255,255,255,.02);border:1px dashed var(--border);border-radius:var(--r-sm)}
    .empty i{font-size:24px;color:var(--text-3);display:block;margin-bottom:6px}
    .empty p{font-size:12px;color:var(--text-3)}
    @media(max-width:900px){.sidebar{display:none}.main{margin-left:0}.form-grid{grid-template-columns:1fr}.form-grid-3{grid-template-columns:1fr 1fr}.panel{width:100vw}.fee-summary{flex-direction:column}}
    @media(max-width:480px){.form-grid-3{grid-template-columns:1fr}}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><div class="logo-mark">A</div><div class="logo-name">AHCA <span>Admin</span></div></div>
  <div class="admin-badge"><i class="ti ti-shield-check"></i> Admin Access</div>
  <a class="nav-a active" href="#"><i class="ti ti-users"></i> Clients</a>
  <a class="nav-a" href="../index.html" target="_blank"><i class="ti ti-world"></i> Website</a>
  <a class="nav-a" href="dashboard.html"><i class="ti ti-layout-dashboard"></i> Client View</a>
  <div style="margin-top:auto">
    <button class="nav-a" id="logoutBtn" style="color:#fca5a5"><i class="ti ti-logout"></i> Sign out</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div><div class="tb-h1">Admin Panel</div><div class="tb-sub" id="adminEmail">Loading…</div></div>
    <button class="btn btn-gold" onclick="showTab('addClient')"><i class="ti ti-user-plus"></i> Add Client</button>
  </div>
  <div class="content">
    <div class="tabs">
      <button class="tab active" onclick="showTab('clients')" id="tab-clients"><i class="ti ti-users"></i> Clients</button>
      <button class="tab" onclick="showTab('addClient')" id="tab-addClient"><i class="ti ti-user-plus"></i> Add Client</button>
      <button class="tab" onclick="showTab('uploadDoc')" id="tab-uploadDoc"><i class="ti ti-upload"></i> Upload Document</button>
    </div>

    <!-- CLIENTS -->
    <div class="tab-panel active" id="panel-clients">
      <div class="card">
        <div class="card-title"><i class="ti ti-users"></i> All Clients <span id="clientCount" style="font-size:13px;font-weight:400;color:var(--text-3)"></span></div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Client</th><th>Services</th><th>Actions</th></tr></thead>
            <tbody id="clientsTbody"><tr><td colspan="3"><div class="loading"><i class="ti ti-loader"></i>Loading…</div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ADD CLIENT -->
    <div class="tab-panel" id="panel-addClient">
      <div class="card">
        <div class="card-title"><i class="ti ti-user-plus"></i> Add New Client</div>
        <div class="form-grid" style="margin-bottom:16px">
          <div class="field"><label>Full Name *</label><input type="text" id="ac_name" placeholder="Ahmed Al Mansouri"></div>
          <div class="field"><label>Company Name</label><input type="text" id="ac_company" placeholder="Al Mansouri Trading LLC"></div>
          <div class="field"><label>Email Address *</label><input type="email" id="ac_email" placeholder="ahmed@company.ae"></div>
          <div class="field"><label>Phone / WhatsApp</label><input type="text" id="ac_phone" placeholder="+971 50 000 0000"></div>
          <div class="field"><label>Password *</label><input type="password" id="ac_pass" placeholder="Min 8 characters"></div>
        </div>
        <div style="margin-bottom:20px">
          <label style="display:block;margin-bottom:10px">Assign Services</label>
          <div class="services-grid">
            <label class="svc-check"><input type="checkbox" value="VAT Filing & Compliance" class="svc-checkbox"><span class="svc-check-lbl">VAT Filing & Compliance</span></label>
            <label class="svc-check"><input type="checkbox" value="Corporate Tax Filing" class="svc-checkbox"><span class="svc-check-lbl">Corporate Tax Filing</span></label>
            <label class="svc-check"><input type="checkbox" value="Bookkeeping & Payroll" class="svc-checkbox"><span class="svc-check-lbl">Bookkeeping & Payroll</span></label>
            <label class="svc-check"><input type="checkbox" value="Financial Reporting & Audit" class="svc-checkbox"><span class="svc-check-lbl">Financial Reporting & Audit</span></label>
            <label class="svc-check"><input type="checkbox" value="Business Advisory" class="svc-checkbox"><span class="svc-check-lbl">Business Advisory</span></label>
            <label class="svc-check"><input type="checkbox" value="FTA Registration" class="svc-checkbox"><span class="svc-check-lbl">FTA Registration</span></label>
          </div>
        </div>
        <button class="btn btn-gold" id="addClientBtn" onclick="addClient()"><i class="ti ti-user-plus"></i> Create Client Account</button>
      </div>
    </div>

    <!-- UPLOAD DOC -->
    <div class="tab-panel" id="panel-uploadDoc">
      <div class="card">
        <div class="card-title"><i class="ti ti-upload"></i> Upload Document for Client</div>
        <div class="form-grid">
          <div class="field full"><label>Client *</label><select id="ud_client"><option value="">— Select client —</option></select></div>
          <div class="field"><label>File Name *</label><input type="text" id="ud_name" placeholder="VAT Return Q1 2025.pdf"></div>
          <div class="field"><label>File URL *</label><input type="text" id="ud_url" placeholder="https://drive.google.com/…"></div>
          <div class="field full"><label>Notes (optional)</label><textarea id="ud_notes" placeholder="Brief description…"></textarea></div>
        </div>
        <button class="btn btn-gold" style="margin-top:20px" onclick="uploadDoc()"><i class="ti ti-cloud-upload"></i> Upload Document</button>
      </div>
    </div>
  </div>
</div>

<!-- SERVICE PANEL -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="panel" id="svcPanel">
  <div class="panel-head">
    <div>
      <div class="panel-title" id="svcPanelTitle">Manage Services</div>
      <div id="svcPanelSub" style="font-size:12px;color:var(--text-3);margin-top:3px"></div>
    </div>
    <button class="panel-close" onclick="closePanel()"><i class="ti ti-x"></i></button>
  </div>
  <div class="panel-body" id="svcPanelBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://bhcadrznoyjpaozpweai.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoY2Fkcnpub3lqcGFvenB3ZWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzUzMjYsImV4cCI6MjA5NzIxMTMyNn0._hmQ-jRicwa3uhQc45ZKer9MVrN4NpJqk3t8FzXtkb4'
);
const ADMIN_EMAIL = 'abedalfattah.91p@gmail.com';

let allClients = [];
let currentClientId = null;
let currentSvcId = null;
let toastTimer;

function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-AE',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function fmtAED(n){ return 'AED '+Number(n||0).toLocaleString('en-AE',{minimumFractionDigits:0}); }

function showToast(msg, type='success'){
  const el=document.getElementById('toast');
  el.className=`toast toast-${type} show`;
  el.innerHTML=`<i class="ti ti-${type==='success'?'circle-check':'alert-circle'}"></i>${msg}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
}

function showTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function closePanel(){
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('svcPanel').classList.remove('open');
  currentClientId=null; currentSvcId=null;
}

// ===== INIT =====
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return}
  if(session.user.email!==ADMIN_EMAIL){
    document.body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;font-family:'Inter',sans-serif;gap:12px">
      <div style="font-size:18px;color:#ef4444">&#9940; Admin access denied</div>
      <div style="font-size:13px;color:#9DB8A4">Logged in as: <strong>${session.user.email}</strong></div>
      <div style="font-size:13px;color:#5C7A63">Expected: ${ADMIN_EMAIL}</div>
      <a href="login.html" style="margin-top:8px;color:#5ECFA0;font-size:13px">← Back to login</a>
    </div>`;
    return;
  }
  document.getElementById('adminEmail').textContent=session.user.email;
  await loadClients();
}

async function loadClients(){
  const {data}=await sb.from('clients').select('id,full_name,company,email,phone').order('full_name');
  allClients=data||[];
  document.getElementById('clientCount').textContent=`(${allClients.length})`;
  await renderClientsTable();
  populateClientDropdown();
}

async function renderClientsTable(){
  const tb=document.getElementById('clientsTbody');
  if(!allClients.length){
    tb.innerHTML=`<tr><td colspan="3"><div class="empty"><i class="ti ti-users"></i><p>No clients yet</p></div></td></tr>`;
    return;
  }
  tb.innerHTML='';
  for(const c of allClients){
    const {data:svcs}=await sb.from('client_services').select('service_name,status,custom_name').eq('client_id',c.id);
    const tr=document.createElement('tr');
    const initials=(c.full_name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const chips=(svcs||[]).map(s=>{
      const cls=s.status==='completed'?'chip-closed':s.status==='pending'?'chip-pending':'';
      const label=(s.custom_name||s.service_name).replace(' & Compliance','').replace(' Filing','').replace(' & Payroll','').replace(' & Audit','');
      return `<span class="chip ${cls}">${label}</span>`;
    }).join('');
    const name=(c.full_name||'').replace(/'/g,'&#39;');
    tr.innerHTML=`
      <td><div class="client-info">
        <div class="client-av">${initials}</div>
        <div><div class="client-name">${c.full_name}</div><div class="client-co">${c.company||c.email}</div></div>
      </div></td>
      <td><div class="svc-chips">${chips||'<span style="font-size:11px;color:var(--text-3)">No services</span>'}</div></td>
      <td><div class="action-btns">
        <button class="act-btn act-btn-gold" onclick="openSvcPanel('${c.id}','${name}')"><i class="ti ti-briefcase"></i> Services</button>
        <button class="act-btn act-btn-green" onclick="quickUpload('${c.id}')"><i class="ti ti-upload"></i> Upload</button>
      </div></td>
    `;
    tb.appendChild(tr);
  }
}

function populateClientDropdown(){
  const sel=document.getElementById('ud_client');
  sel.innerHTML='<option value="">— Select client —</option>';
  allClients.forEach(c=>{ sel.innerHTML+=`<option value="${c.id}">${c.full_name}${c.company?' ('+c.company+')':''}</option>`; });
}

function quickUpload(clientId){
  showTab('uploadDoc');
  document.getElementById('ud_client').value=clientId;
}

// ===== ADD CLIENT =====
async function addClient(){
  const name=document.getElementById('ac_name').value.trim();
  const email=document.getElementById('ac_email').value.trim();
  const pass=document.getElementById('ac_pass').value;
  const company=document.getElementById('ac_company').value.trim();
  const phone=document.getElementById('ac_phone').value.trim();
  const selected=[...document.querySelectorAll('.svc-checkbox:checked')].map(c=>c.value);
  if(!name||!email||!pass){showToast('Name, email and password required','error');return}
  if(pass.length<8){showToast('Password min 8 characters','error');return}
  const btn=document.getElementById('addClientBtn');
  btn.disabled=true; btn.innerHTML='<div class="spin"></div> Creating…';
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(error){showToast(error.message,'error');btn.disabled=false;btn.innerHTML='<i class="ti ti-user-plus"></i> Create Client Account';return}
  const userId=data.user.id;
  await sb.from('clients').upsert({id:userId,full_name:name,email,company:company||null,phone:phone||null});
  if(selected.length){
    await sb.from('client_services').insert(selected.map(sn=>({client_id:userId,service_name:sn,status:'active'})));
  }
  showToast(`Client "${name}" created!`);
  ['ac_name','ac_email','ac_pass','ac_company','ac_phone'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('.svc-checkbox').forEach(c=>c.checked=false);
  btn.disabled=false; btn.innerHTML='<i class="ti ti-user-plus"></i> Create Client Account';
  await loadClients();
  showTab('clients');
}

// ===== UPLOAD DOC =====
async function uploadDoc(){
  const clientId=document.getElementById('ud_client').value;
  const name=document.getElementById('ud_name').value.trim();
  const url=document.getElementById('ud_url').value.trim();
  const notes=document.getElementById('ud_notes').value.trim();
  if(!clientId||!name||!url){showToast('Client, file name and URL required','error');return}
  const {error}=await sb.from('documents').insert({client_id:clientId,file_name:name,file_url:url,notes:notes||null});
  if(error){showToast(error.message,'error');return}
  showToast('Document uploaded!');
  ['ud_name','ud_url','ud_notes'].forEach(id=>document.getElementById(id).value='');
}

// ===== SERVICE PANEL =====
async function openSvcPanel(clientId, clientName){
  currentClientId=clientId;
  document.getElementById('svcPanelTitle').textContent='Manage Services';
  document.getElementById('svcPanelSub').textContent=clientName;
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('svcPanel').classList.add('open');
  await renderSvcList();
}

async function renderSvcList(){
  currentSvcId=null;
  const body=document.getElementById('svcPanelBody');
  document.getElementById('svcPanelTitle').textContent='Manage Services';
  body.innerHTML=`<div class="loading"><i class="ti ti-loader"></i>Loading…</div>`;
  const {data:svcs}=await sb.from('client_services').select('*').eq('client_id',currentClientId).order('created_at');

  body.innerHTML=`
    <div style="margin-bottom:22px">
      <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px">Current Services</div>
      ${(svcs||[]).length?(svcs||[]).map(s=>{
        const statusColor=s.status==='completed'?'var(--text-3)':s.status==='pending'?'var(--gold)':'var(--green-l)';
        const statusLabel=s.status==='completed'?'Closed':s.status==='pending'?'In Progress':'Active';
        return `<div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${s.custom_name||s.service_name}</div>
            ${s.custom_name?`<div style="font-size:11px;color:var(--text-3)">${s.service_name}</div>`:''}
            <div style="font-size:11px;color:${statusColor};margin-top:3px;font-weight:600">● ${statusLabel}</div>
          </div>
          <button class="act-btn act-btn-gold" onclick="openSvcEdit('${s.id}')"><i class="ti ti-edit"></i> Edit</button>
        </div>`;
      }).join(''):`<div class="empty"><i class="ti ti-briefcase"></i><p>No services assigned</p></div>`}
    </div>

    <hr class="section-divider">
    <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px">+ Add New Service</div>
    <div class="form-grid" style="margin-bottom:14px">
      <div class="field">
        <label>Service Type</label>
        <select id="ns_type">
          <option>VAT Filing &amp; Compliance</option>
          <option>Corporate Tax Filing</option>
          <option>Bookkeeping &amp; Payroll</option>
          <option>Financial Reporting &amp; Audit</option>
          <option>Business Advisory</option>
          <option>FTA Registration</option>
        </select>
      </div>
      <div class="field"><label>Custom Name (optional)</label><input type="text" id="ns_custom" placeholder="e.g. VAT Return Q1 2025"></div>
      <div class="field"><label>Assignment Date</label><input type="date" id="ns_start" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Submission / Deadline</label><input type="date" id="ns_submission"></div>
      <div class="field"><label>Total Fees (AED)</label><input type="number" id="ns_fees" placeholder="0" min="0"></div>
      <div class="field">
        <label>Status</label>
        <select id="ns_status"><option value="active">Active</option><option value="pending">In Progress</option><option value="completed">Closed</option></select>
      </div>
      <div class="field full"><label>Notes for client</label><textarea id="ns_notes" placeholder="Notes visible to client…"></textarea></div>
    </div>
    <button class="btn btn-gold" onclick="addService()"><i class="ti ti-plus"></i> Add Service</button>
  `;
}

async function openSvcEdit(svcId){
  currentSvcId=svcId;
  const body=document.getElementById('svcPanelBody');
  body.innerHTML=`<div class="loading"><i class="ti ti-loader"></i>Loading…</div>`;

  const {data:s}=await sb.from('client_services').select('*').eq('id',svcId).single();
  const {data:pays}=await sb.from('payments').select('*').eq('service_id',svcId).order('payment_date');
  const payList=pays||[];
  const totalPaid=payList.reduce((a,p)=>a+Number(p.amount),0);
  const fees=Number(s.fees||0);
  const balance=fees-totalPaid;

  document.getElementById('svcPanelTitle').textContent=s.custom_name||s.service_name;
  document.getElementById('svcPanelSub').textContent=s.service_name;

  body.innerHTML=`
    <button style="background:none;border:none;color:var(--gold-l);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:18px;padding:0" onclick="renderSvcList()">
      <i class="ti ti-arrow-left"></i> All services
    </button>

    <div class="ptabs">
      <button class="ptab active" id="ptab-info" onclick="switchPtab('info')"><i class="ti ti-info-circle"></i> Details</button>
      <button class="ptab" id="ptab-pay" onclick="switchPtab('pay')"><i class="ti ti-receipt"></i> Payments</button>
    </div>

    <div class="ptab-panel active" id="ptab-panel-info">
      <div class="form-grid" style="margin-bottom:16px">
        <div class="field"><label>Service Type</label><input type="text" value="${s.service_name}" disabled style="opacity:.5"></div>
        <div class="field"><label>Custom Name</label><input type="text" id="es_custom" value="${s.custom_name||''}" placeholder="Custom label"></div>
        <div class="field"><label>Assignment Date</label><input type="date" id="es_start" value="${s.start_date||''}"></div>
        <div class="field"><label>Submission / Deadline</label><input type="date" id="es_submission" value="${s.submission_date||''}"></div>
        <div class="field"><label>Total Fees (AED)</label><input type="number" id="es_fees" value="${s.fees||0}" min="0"></div>
        <div class="field">
          <label>Status</label>
          <select id="es_status">
            <option value="active" ${(s.status||'active')==='active'?'selected':''}>Active</option>
            <option value="pending" ${s.status==='pending'?'selected':''}>In Progress</option>
            <option value="completed" ${s.status==='completed'?'selected':''}>Closed</option>
          </select>
        </div>
        <div class="field full"><label>Notes for client</label><textarea id="es_notes">${s.notes||''}</textarea></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold" onclick="saveService()"><i class="ti ti-device-floppy"></i> Save Changes</button>
        <button class="btn" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5" onclick="deleteService('${svcId}')"><i class="ti ti-trash"></i> Delete</button>
      </div>
    </div>

    <div class="ptab-panel" id="ptab-panel-pay">
      <div class="fee-summary">
        <div class="fee-box"><div class="fee-box-lbl">Total Fees</div><div class="fee-box-val">${fmtAED(fees)}</div></div>
        <div class="fee-box"><div class="fee-box-lbl">Paid</div><div class="fee-box-val" style="color:var(--green-l)">${fmtAED(totalPaid)}</div></div>
        <div class="fee-box"><div class="fee-box-lbl">${balance<=0?'Fully Paid':'Balance'}</div><div class="fee-box-val" style="color:${balance<=0?'var(--green-l)':'var(--gold)'}">${fmtAED(Math.max(0,balance))}</div></div>
      </div>

      <div id="paysList">
        ${payList.length?payList.map(p=>payRowHtml(p)).join(''):
        `<div class="empty"><i class="ti ti-receipt-off"></i><p>No payments yet</p></div>`}
      </div>

      <hr class="section-divider">
      <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px">Record Payment</div>
      <div class="form-grid-3" style="margin-bottom:14px">
        <div class="field">
          <label>Type</label>
          <select id="np_type"><option value="advance">Advance</option><option value="second">Second Payment</option><option value="final">Final Payment</option><option value="other">Other</option></select>
        </div>
        <div class="field"><label>Amount (AED)</label><input type="number" id="np_amount" placeholder="0" min="0"></div>
        <div class="field"><label>Date</label><input type="date" id="np_date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field full"><label>Notes (optional)</label><input type="text" id="np_notes" placeholder="e.g. Cash received"></div>
      </div>
      <button class="btn btn-green" onclick="addPayment('${svcId}','${currentClientId}')"><i class="ti ti-plus"></i> Record Payment</button>
    </div>
  `;
}

function payRowHtml(p){
  const icoClass={advance:'pay-ico--advance',second:'pay-ico--second',final:'pay-ico--final',other:'pay-ico--other'}[p.payment_type]||'pay-ico--other';
  const icoIcon={advance:'ti-coins',second:'ti-cash',final:'ti-circle-check',other:'ti-credit-card'}[p.payment_type]||'ti-credit-card';
  return `<div class="pay-row">
    <div class="pay-ico ${icoClass}"><i class="ti ${icoIcon}"></i></div>
    <div class="pay-info">
      <div class="pay-type">${p.payment_type} Payment</div>
      <div class="pay-date">${fmtDate(p.payment_date)}</div>
      ${p.notes?`<div class="pay-note">${p.notes}</div>`:''}
    </div>
    <div class="pay-amount">${fmtAED(p.amount)}</div>
    <button class="pay-del" onclick="deletePayment('${p.id}','${p.service_id}','${p.client_id}')"><i class="ti ti-trash"></i></button>
  </div>`;
}

function switchPtab(name){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.ptab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('ptab-'+name).classList.add('active');
  document.getElementById('ptab-panel-'+name).classList.add('active');
}

async function addService(){
  const type=document.getElementById('ns_type').value;
  const custom=document.getElementById('ns_custom').value.trim()||null;
  const start=document.getElementById('ns_start').value||null;
  const submission=document.getElementById('ns_submission').value||null;
  const fees=parseFloat(document.getElementById('ns_fees').value)||0;
  const status=document.getElementById('ns_status').value;
  const notes=document.getElementById('ns_notes').value.trim()||null;
  const {error}=await sb.from('client_services').insert({client_id:currentClientId,service_name:type,custom_name:custom,start_date:start,submission_date:submission,fees,status,notes});
  if(error){showToast(error.message,'error');return}
  showToast('Service added!');
  await renderSvcList();
  await loadClients();
}

async function saveService(){
  const custom=document.getElementById('es_custom').value.trim()||null;
  const start=document.getElementById('es_start').value||null;
  const submission=document.getElementById('es_submission').value||null;
  const fees=parseFloat(document.getElementById('es_fees').value)||0;
  const status=document.getElementById('es_status').value;
  const notes=document.getElementById('es_notes').value.trim()||null;
  const {error}=await sb.from('client_services').update({custom_name:custom,start_date:start,submission_date:submission,fees,status,notes}).eq('id',currentSvcId);
  if(error){showToast(error.message,'error');return}
  showToast('Saved!');
  await openSvcEdit(currentSvcId);
  await loadClients();
}

async function deleteService(svcId){
  if(!confirm('Delete this service and all its payments?')) return;
  await sb.from('payments').delete().eq('service_id',svcId);
  const {error}=await sb.from('client_services').delete().eq('id',svcId);
  if(error){showToast(error.message,'error');return}
  showToast('Service deleted');
  await renderSvcList();
  await loadClients();
}

async function addPayment(svcId, clientId){
  const type=document.getElementById('np_type').value;
  const amount=parseFloat(document.getElementById('np_amount').value);
  const date=document.getElementById('np_date').value;
  const notes=document.getElementById('np_notes').value.trim()||null;
  if(!amount||amount<=0){showToast('Enter a valid amount','error');return}
  const {error}=await sb.from('payments').insert({service_id:svcId,client_id:clientId,payment_type:type,amount,payment_date:date,notes});
  if(error){showToast(error.message,'error');return}
  showToast('Payment recorded!');
  document.getElementById('np_amount').value='';
  document.getElementById('np_notes').value='';
  // Auto-close check
  const {data:pays}=await sb.from('payments').select('amount').eq('service_id',svcId);
  const {data:svc}=await sb.from('client_services').select('fees,status').eq('id',svcId).single();
  const totalPaid=(pays||[]).reduce((a,p)=>a+Number(p.amount),0);
  if(Number(svc?.fees||0)>0 && totalPaid>=Number(svc.fees) && svc.status!=='completed'){
    if(confirm(`Fully paid (${fmtAED(totalPaid)}). Mark as Closed?`)){
      await sb.from('client_services').update({status:'completed'}).eq('id',svcId);
      showToast('Service marked Closed ✓');
    }
  }
  await openSvcEdit(svcId);
}

async function deletePayment(payId, svcId){
  if(!confirm('Delete this payment?')) return;
  await sb.from('payments').delete().eq('id',payId);
  showToast('Deleted');
  await openSvcEdit(svcId);
}

document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();window.location.href='login.html'});
init();
</script>
</body>
</html>
